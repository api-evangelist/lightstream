      codec:
        $ref: '#/definitions/v21VideoCodec'
        example: VIDEO_CODEC_H264
        default: VIDEO_CODEC_H264
        title: video encoding codec
      rateControl:
        $ref: '#/definitions/v21VideoCodecRateControl'
        default: '{}'
        title: video encoding rate control
      profile:
        $ref: '#/definitions/v21VideoCodecProfile'
        example: VIDEO_CODEC_PROFILE_HIGH
        default: VIDEO_CODEC_PROFILE_HIGH
        title: video encoding codec profile
    title: encoding video parameters
  v21VideoRendering:
    type: object
    properties:
      height:
        type: integer
        format: int64
        example: 720
        default: '720'
        title: canvas height (pixels)
        maximum: 2160
        minimum: 240
      width:
        type: integer
        format: int64
        example: 1280
        default: '1280'
        title: canvas width (pixels)
        maximum: 3840
        minimum: 320
      framerate:
        type: number
        format: float
        example: 30
        default: '30'
        title: canvas frame rate (frames/s)
        maximum: 60
        minimum: 1
      colorSpace:
        $ref: '#/definitions/v21VideoColorSpace'
        example: VIDEO_COLOR_SPACE_YUV420
        default: VIDEO_COLOR_SPACE_YUV420
        title: rendering color space
    title: composition video parameters
  v21WebRtc:
    type: object
    properties:
      hosted:
        $ref: '#/definitions/v21HostedWebRtc'
        title: hosted webrtc configuration
    title: webrtc service (select one)
  v21WebRtcAccess:
    type: object
    properties:
      accessToken:
        type: string
        example: eyJ0eXAiOiJqd3QiLCJhbGciOiJSUzI1NiIsImtpZCI6IkN3dXNNbmZFZl93Nk9
        title: access token for webrtc room
      participantId:
        type: string
        example: 7132b004-61e8-49c1-8dc8-4bb3269ce6f
        title: the id this user was assigned in the webrtc room
        readOnly: true
    title: webrtc access parameters
securityDefinitions:
  AccessToken:
    type: apiKey
    description: >-
      Assert your access token into a HTTP Header named 'Authorization:
      Bearer'<br><pre>curl -H 'Authorization: Bearer bar'
      https://live.api.stream/live/v2/collection/foo</pre>
    name: 'Authorization: Bearer'
    in: header
  ApiKey:
    type: apiKey
    description: >-
      Assert your api key into a HTTP Header named 'X-API-Key'<br><pre>curl -H
      'X-API-Key:bar' https://live.api.stream/live/v2/collection/foo</pre>
    name: X-API-Key
    in: header
security:
  - AccessToken: []
x-tagGroups:
  - name: Services
    tags:
      - CollectionService
      - ProjectService
      - SourceService
      - DestinationService
      - AuthenticationService
      - BackendAuthenticationService
      - PublicAuthenticationService
