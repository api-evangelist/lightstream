swagger: '2.0'
info:
  title: API.stream Live API
  description: The Live API enables developers to build video-enabled applications.
  version: '2.1'
tags:
  - name: CollectionService
    description: |-
      The Collection Service operates on collections, which contain projects and
      collection live sources used in projects.
  - name: ProjectService
    description: The Project Service operates on a Project.
  - name: DestinationService
    description: |-
      The Destination Service operates on Project Destinations. Destinations
      designate where a Broadcast associated with a Project is distributed
      downstream.
  - name: SourceService
    description: >-
      The Source Service operates on Collection Live Sources and Project
      Sources.
  - name: BackendAuthenticationService
    description: |-
      The Backend Authentication Service provides token services for partner
      backend systems
  - name: AuthenticationService
    description: The Authentication Service provides token services for clients
  - name: PublicAuthenticationService
    description: The Public Authentication Service provides token verification services
host: live.api.stream
basePath: /live/v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /authentication/jwks:
    get:
      summary: Get Public Keys
      description: Get public keys used to sign access tokens
      operationId: PublicAuthenticationService_GetJsonWebKeySet
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetJsonWebKeySetResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - PublicAuthenticationService
  /authentication/token:
    post:
      summary: Create Access Token
      description: Create an access token for a session host
      operationId: BackendAuthenticationService_CreateAccessToken
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21CreateAccessTokenResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v21CreateAccessTokenRequest'
      tags:
        - BackendAuthenticationService
      security:
        - ApiKey: []
    put:
      summary: Refresh Access Token
      description: Forcibly refresh an access token prior to expiration
      operationId: AuthenticationService_RefreshAccessToken
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21RefreshAccessTokenResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v21RefreshAccessTokenRequest'
      tags:
        - AuthenticationService
  /authentication/token/guest:
    post:
      summary: Create Guest Access Token
      description: Create an access token for a guest
      operationId: AuthenticationService_CreateGuestAccessToken
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21CreateGuestAccessTokenResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v21CreateGuestAccessTokenRequest'
      tags:
        - AuthenticationService
  /collection:
    get:
      summary: Get Collections
      description: Get all collections owned by the user
      operationId: CollectionService_GetCollections
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetCollectionsResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - CollectionService
    post:
      summary: Create Collection
      description: Create a new collection of related projects and collection live sources
      operationId: CollectionService_CreateCollection
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21CreateCollectionResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v21CreateCollectionRequest'
      tags:
        - CollectionService
  /collection/{collectionId}:
    get:
      summary: Get Collection
      description: |-
        Get an existing collection of related projects and collection live
        sources
      operationId: CollectionService_GetCollection
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetCollectionResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection id
          in: path
          required: true
          type: string
        - name: populateProjects
          description: optionally populate projects.
          in: query
          required: false
          type: boolean
          default: 'true'
        - name: populateSources
          description: optionally populate sources.
          in: query
          required: false
          type: boolean
          default: 'true'
      tags:
        - CollectionService
    delete:
      summary: Delete Collection
      description: Delete a collection of related projects and collection live sources
      operationId: CollectionService_DeleteCollection
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21DeleteCollectionResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection id
          in: path
          required: true
          type: string
        - name: force
          description: forcibly end all child project broadcasts in progress.
          in: query
          required: false
          type: boolean
          default: 'false'
      tags:
        - CollectionService
    patch:
      summary: Update Collection
      description: Update select collection document data
      operationId: CollectionService_UpdateCollection
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21UpdateCollectionResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              updateMask:
                type: string
                example: metadata
                title: fields to update
                required:
                  - update_mask
              metadata:
                type: object
                example:
                  createdBy: Eddie Current
                title: arbitrary metadata to associate with this collection
            required:
              - updateMask
      tags:
        - CollectionService
  /collection/{collectionId}/project:
    post:
      summary: Create Project
      description: Create a new project
      operationId: ProjectService_CreateProject
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21CreateProjectResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which will own this project
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              metadata:
                type: object
                example:
                  createdBy: Eddie Current
                title: arbitrary metadata to associate with this project
              rendering:
                $ref: '#/definitions/v21Rendering'
                default: '{}'
                title: composition parameters
              encoding:
                $ref: '#/definitions/v21Encoding'
                default: '{}'
                title: encoding parameters
              composition:
                $ref: '#/definitions/v21Composition'
                title: composition/layout source of the broadcast
              maxDuration:
                type: integer
                format: int64
                example: 172800000
                default: '172800000'
                title: maximum duration of project broadcasts (ms)
                maximum: 604800000
              webrtc:
                $ref: '#/definitions/v21WebRtc'
                title: request webrtc services
              location:
                $ref: '#/definitions/v21LatLong'
                title: optimal broadcast location (for routing and delay)
      tags:
        - ProjectService
  /collection/{collectionId}/project/{projectId}:
    get:
      summary: Get Project
      description: Get an existing project
      operationId: ProjectService_GetProject
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetProjectResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: status
          description: also query project broadcast status.
          in: query
          required: false
          type: boolean
          default: 'false'
      tags:
        - ProjectService
    delete:
      summary: Delete Project
      description: Delete a project
      operationId: ProjectService_DeleteProject
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21DeleteProjectResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: force
          description: forcibly end broadcast in progress.
          in: query
          required: false
          type: boolean
          default: 'false'
      tags:
        - ProjectService
    patch:
      summary: Update Project
      description: Updates a project
      operationId: ProjectService_UpdateProject
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21UpdateProjectResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              updateMask:
                type: string
                example: metadata, maxDuration, rendering.video.frameRate
                title: fields to update
                required:
                  - update_mask
              metadata:
                type: object
                example:
                  createdBy: Eddie Current
                title: arbitrary metadata to associate with this project
              rendering:
                $ref: '#/definitions/v21Rendering'
                title: composition parameters
              encoding:
                $ref: '#/definitions/v21Encoding'
                title: encoding parameters
              composition:
                $ref: '#/definitions/v21Composition'
                title: composition/layout source of the broadcast
              maxDuration:
                type: integer
                format: int64
                example: 172800000
                title: maximum duration of project broadcasts (ms)
                maximum: 604800000
              webrtc:
                $ref: '#/definitions/v21WebRtc'
                title: configuration for webrtc services (if requested)
              location:
                $ref: '#/definitions/v21LatLong'
                title: optimal broadcast location (for routing and delay)
            required:
              - updateMask
      tags:
        - ProjectService
  /collection/{collectionId}/project/{projectId}/broadcast/snapshot:
    get:
      summary: Get Snapshot
      description: Get a snapshot of the current output frame of the broadcast
      operationId: ProjectService_GetProjectBroadcastSnapshot
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetProjectBroadcastSnapshotResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: format
          description: snapshot binary format.
          in: query
          required: false
          type: string
          enum:
            - IMAGE_FORMAT_JPEG
      tags:
        - ProjectService
      produces:
        - image/jpeg
  /collection/{collectionId}/project/{projectId}/broadcast/start:
    put:
      summary: Start Broadcast
      description: Start broadcasting a project
      operationId: ProjectService_StartProjectBroadcast
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21StartProjectBroadcastResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: webrtcStart
          description: also start webrtc room.
          in: query
          required: false
          type: boolean
          default: 'false'
      tags:
        - ProjectService
  /collection/{collectionId}/project/{projectId}/broadcast/status:
    get:
      summary: Get Broadcast Status
      description: Get the broadcast status of the project
      operationId: ProjectService_GetProjectBroadcastStatus
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetProjectBroadcastStatusResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
      tags:
        - ProjectService
  /collection/{collectionId}/project/{projectId}/broadcast/stop:
    put:
      summary: Stop Broadcast
      description: Stop broadcasting a project
      operationId: ProjectService_StopProjectBroadcast
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21StopProjectBroadcastResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project
          in: path
          required: true
          type: string
        - name: projectId
          description: project id
          in: path
          required: true
          type: string
        - name: webrtcStop
          description: stop the associated webrtc room,.
          in: query
          required: false
          type: boolean
          default: 'false'
      tags:
        - ProjectService
  /collection/{collectionId}/project/{projectId}/destination:
    post:
      summary: Create Destination
      description: Create a new Destination
      operationId: DestinationService_CreateDestination
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21CreateDestinationResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project which owns the destination
          in: path
          required: true
          type: string
        - name: projectId
          description: project which will own this destination
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              metadata:
                type: object
                example:
                  createdBy: Eddie Current
                title: arbitrary metadata associated with this destination
              address:
                $ref: '#/definitions/v21DestinationAddress'
                title: destination address (select one)
              enabled:
                type: boolean
                example: true
                default: 'true'
                title: enable or disable this destination
              timeout:
                type: integer
                format: int64
                example: 5000
                default: '5000'
                title: >-
                  timeout (in milliseconds) to wait before resetting a
                  connection
                maximum: 30000
                minimum: 100
      tags:
        - DestinationService
  /collection/{collectionId}/project/{projectId}/destination/{destinationId}:
    get:
      summary: Get Destination
      description: Get an existing Destination.
      operationId: DestinationService_GetDestination
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21GetDestinationResponse'
        '401':
          description: The access token provided is not valid
          schema: {}
        '403':
          description: The access token provided does not have access to specified resource
          schema: {}
        '404':
          description: The specified resource was not found
          schema: {}
        '429':
          description: >-
            The specified service is busy; please use an exponential backoff on
            subsequent requests.
          schema: {}
        '500':
          description: The specified service is unavailable; please try again later
          schema: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: collectionId
          description: collection which owns the project which owns the destination
          in: path
          required: true
          type: string
        - name: projectId
          description: project which owns the destination
          in: path
          required: true
          type: string
        - name: destinationId
          description: destination id
          in: path
          required: true
          type: string
      tags:
        - DestinationService
    delete:
      summary: Delete Destination
      description: Delete a destination
      operationId: DestinationService_DeleteDestination
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v21DeleteDestinationResponse'
