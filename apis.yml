aid: lightstream
name: Lightstream
description: 'Lightstream (Infiniscene, Inc.) is a Techstars-backed live video company best known for
  Lightstream Studio, a browser-based streaming studio used by creators to broadcast to Twitch, YouTube
  and other destinations without installing desktop encoding software. Lightstream also operates API.stream,
  its developer platform, which exposes the same cloud video pipeline to development partners as three
  API-first services: a Live API for managing collections, projects, sources, destinations and broadcasts;
  a Layout API for building and animating layered scene compositions; and an Event API for publishing
  and subscribing to real-time events across collaborators, guests and renderers. All three services are
  defined as gRPC Protobuf contracts and fronted by gRPC-Web and REST gateways, secured with a JWT access-token
  model and role-based permissions (HOST, COHOST, CONTRIBUTOR, GUEST, VIEWER), with first-party JavaScript/TypeScript
  SDKs and a Studio Kit for embedding a full studio experience.'
